<h2 mat-dialog-title>
  <strong>{{ data.title }}</strong>
</h2>

<mat-dialog-content>
  <p>
    @if (data.highlightText) {
      {{ data.messageBefore }}<strong>{{ data.highlightText }}</strong
      >{{ data.messageAfter }}
    } @else {
      {{ data.message }}
    }
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (data.showCancel !== false) {
    <button mat-button (click)="cancelar()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
  }

  <button mat-flat-button (click)="confirmar()">
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
