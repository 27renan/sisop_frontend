<mat-toolbar class="header">
  <!-- LOGO -->
  <div class="logo">
    <img src="/images/logo.png" alt="Logo SISOP" />
  </div>

  <!-- TÍTULO -->
  <div class="title">
    <h3>Bem-vindo ao SISOP</h3>
    <span>Sistema de Obras e Patrimônio Imobiliário</span>
  </div>

  <span class="spacer"></span>

  <!-- USUÁRIO -->
  <button mat-button [matMenuTriggerFor]="menuUsuario" class="user-button">
    <div class="user">
      <div class="user-avatar">
        <mat-icon>person</mat-icon>
      </div>

      <div class="user-info">
        <strong>{{ nomeUsuario }}</strong>
        <span>{{ omUsuario }}</span>
      </div>

      <mat-icon class="arrow-icon">keyboard_arrow_down</mat-icon>
    </div>
  </button>
</mat-toolbar>

<!-- MENU DO USUÁRIO -->
<mat-menu #menuUsuario="matMenu" class="user-menu">
  <button mat-menu-item>
    <mat-icon>person_outline</mat-icon>
    <span>Perfil</span>
  </button>

  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Configurações</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="logout()" class="logout-button">
    <mat-icon>logout</mat-icon>
    <span>Sair do sistema</span>
  </button>
</mat-menu>
