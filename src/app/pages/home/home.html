<section class="page">
  <app-header [nomeUsuario]="nomeUsuario" [omUsuario]="omUsuario"> </app-header>

  <mat-drawer-container class="drawer-container" autosize>
    <mat-drawer #drawer class="sidenav" mode="over">
      <app-nav></app-nav>
    </mat-drawer>

    <div class="content">
      <div class="title-page">
        <button type="button" mat-icon-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span>Dashboard</span>
      </div>

      <!-- conteúdo da Home -->
      <!-- cadrs -->
      <div class="dashboard-cards">
        <mat-card class="dashboard-card">
          <mat-card-content>
            <div class="card-icon">
              <mat-icon>construction</mat-icon>
            </div>

            <div class="card-info">
              <span class="card-title">Obras</span>
              <strong>125</strong>
              <small>Obras cadastradas</small>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="dashboard-card">
          <mat-card-content>
            <div class="card-icon">
              <mat-icon>apartment</mat-icon>
            </div>

            <div class="card-info">
              <span class="card-title">Imóveis</span>
              <strong>84</strong>
              <small>Imóveis cadastrados</small>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="dashboard-card">
          <mat-card-content>
            <div class="card-icon">
              <mat-icon>inventory_2</mat-icon>
            </div>

            <div class="card-info">
              <span class="card-title">Patrimônio</span>
              <strong>1.245</strong>
              <small>Itens cadastrados</small>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="dashboard-card">
          <mat-card-content>
            <div class="card-icon">
              <mat-icon>eco</mat-icon>
            </div>

            <div class="card-info">
              <span class="card-title">Gestão Ambiental</span>
              <strong>32</strong>
              <small>Processos ativos</small>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
      <!-- cadrs (fim) -->

      <!--grafico-->
      <div class="dashboard-graficos">
        <mat-card class="dashboard-grafico">
          <mat-card-content>
            <apx-chart
              [series]="chartObras.series"
              [chart]="chartObras.chart"
              [labels]="chartObras.labels"
              [title]="chartObras.title"
            >
            </apx-chart>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- fim da home-->
    </div>
  </mat-drawer-container>
</section>
